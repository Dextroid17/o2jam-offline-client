# Build the installers on the real thing: Linux runners for the binary + AppImage,
# a Windows runner for the .exe. This is the job that proves install.ps1 actually
# works on Windows instead of "should work".
#
# Every push that touches the installers builds them, and the built binaries have
# to pass their own self-test before the job is green. Artifacts are attached to
# the run, so a normal Windows user can download the .exe without building it.

name: build installers

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'installer/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'patches/**'
      - '.github/workflows/build-installers.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'packaging/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux -- binary + AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: syntax-check the shell drivers
        run: |
          bash -n install.sh
          for f in scripts/*.sh; do bash -n "$f"; done
          echo "shell drivers parse clean"

      - name: install tk on the runner (PyInstaller needs it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb imagemagick

      - name: build the Linux installers
        run: bash packaging/build-linux.sh

      - name: the built binary must pass its own self-test
        run: |
          ./dist/O2Jam-Installer --self-test
          ./dist/O2Jam-Installer-x86_64.AppImage --appimage-extract-and-run --self-test

      - name: the window must actually open
        run: |
          xvfb-run -a -s "-screen 0 1280x820x24" bash -c \
            './dist/O2Jam-Installer & sleep 8; import -window root /tmp/gui.png; kill %1'
          test -s /tmp/gui.png && echo "window rendered"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-installers
          if-no-files-found: error
          path: |
            dist/O2Jam-Installer
            dist/O2Jam-Installer-x86_64.AppImage

  windows:
    name: windows -- .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: parse-check install.ps1 with real PowerShell
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD 'install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) {
              $errors | ForEach-Object { Write-Host "line $($_.Extent.StartLineNumber): $($_.Message)" }
              exit 1
          }
          'install.ps1 parses clean'

      - name: build the standalone .exe
        shell: pwsh
        run: ./packaging/build-windows.ps1 -SkipInno

      - name: the built .exe must pass its own self-test
        shell: pwsh
        run: |
          # The installer is a GUI-subsystem exe, and PowerShell's call operator does
          # NOT wait for those: $LASTEXITCODE stays $null, $null -ne 0 is true, and a
          # perfectly good build gets reported as failed. Start-Process -Wait gives a
          # real wait and a real exit code.
          $p = Start-Process -FilePath ./dist/O2Jam-Installer.exe `
                             -ArgumentList '--self-test' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          "self-test exit code 0 -- OK"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-installers
          if-no-files-found: error
          path: dist/O2Jam-Installer.exe
